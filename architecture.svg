<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 552" width="1320" height="552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-tsc" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-rtc" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1320" height="552" rx="10" fill="#ffffff"/>

  <!-- Header -->
  <text x="660" y="29" font-size="18.5" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="-0.2">Tempo System 1 + System 2 Serving Architecture</text>

  <!-- ==================== COLUMN 1: ROBOT STREAMS ==================== -->
  <rect x="18" y="48" width="212" height="432" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="124" y="74" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">1. Robot Streams (N)</text>
  <line x1="34" y1="86" x2="214" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Slow Stream -->
  <rect x="32" y="108" width="184" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="124" y="135" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">Slow Stream (1–10 Hz)</text>
  <text x="124" y="156" font-size="11.5" fill="#475569" text-anchor="middle">Multi-View RGB &amp; Language</text>
  <rect x="44" y="174" width="160" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="195" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Latest-Only Overwrite</text>

  <!-- Fast Stream -->
  <rect x="32" y="336" width="184" height="118" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="124" y="363" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">Fast Stream (10–30 Hz)</text>
  <text x="124" y="384" font-size="11.5" fill="#475569" text-anchor="middle">Proprioception &amp; Wrist Cam</text>
  <rect x="44" y="402" width="160" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="124" y="423" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">Latest-Only Overwrite</text>

  <!-- ==================== COLUMN 2: C++ SCHEDULER ==================== -->
  <rect x="272" y="48" width="234" height="432" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="389" y="74" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">2. C++ Scheduler</text>
  <line x1="288" y1="86" x2="490" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <!-- AoI Priority Queue -->
  <rect x="288" y="108" width="202" height="98" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="389" y="136" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">AoI Priority Queue</text>
  <text x="389" y="158" font-size="11.5" fill="#1e40af" text-anchor="middle">Refreshes Stalest Robots First</text>
  <text x="389" y="179" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="middle">AoI = t_now − t_obs</text>

  <!-- Bandwidth Guard -->
  <rect x="288" y="236" width="202" height="72" rx="8" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5"/>
  <text x="389" y="264" font-size="13" font-weight="700" fill="#9f1239" text-anchor="middle">Colocated Slice Guard</text>
  <text x="389" y="286" font-size="11.5" font-weight="600" fill="#be123c" text-anchor="middle">Yields HBM in ≤ 2.0 ms</text>

  <!-- Slack-Time Batcher -->
  <rect x="288" y="346" width="202" height="108" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="389" y="374" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">Slack-Time Batcher</text>
  <text x="389" y="396" font-size="11.5" fill="#047857" text-anchor="middle">Selects Max Feasible Bucket</text>
  <text x="389" y="416" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">B ∈ {1..64} within deadline_ms</text>

  <!-- ==================== COLUMN 3: GPU EXECUTION & CACHE ==================== -->
  <rect x="554" y="48" width="462" height="432" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.7" filter="url(#card-shadow)"/>
  <text x="785" y="74" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3. GPU Execution &amp; Shared State Cache</text>
  <line x1="572" y1="86" x2="998" y2="86" stroke="#cbd5e1" stroke-width="1"/>

  <!-- System 2 Slow Executor -->
  <rect x="570" y="100" width="430" height="98" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="785" y="123" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">System 2 — Slow VLM Backbone</text>
  <rect x="584" y="135" width="195" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="681.5" y="156" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Colocated Slicing</text>
  <text x="681.5" y="174" font-size="11" fill="#2563eb" text-anchor="middle">Piecewise ≤ 2.0 ms CUDA Graphs</text>
  <rect x="791" y="135" width="195" height="50" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="888.5" y="156" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Disaggregated &amp; Pipeline</text>
  <text x="888.5" y="174" font-size="11" fill="#2563eb" text-anchor="middle">Data &amp; Pipeline Parallelism</text>

  <!-- Shared KV & Latent Cache -->
  <rect x="570" y="232" width="430" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="785" y="256" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">Shared KV &amp; Latent Cache</text>
  <rect x="584" y="268" width="195" height="54" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="681.5" y="290" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Lock-Free RCU Slots</text>
  <text x="681.5" y="309" font-size="11" fill="#78350f" text-anchor="middle">Atomic Ptr + Reader Bitmap</text>
  <rect x="791" y="268" width="195" height="54" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="888.5" y="290" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Paged Memory Pool</text>
  <text x="888.5" y="309" font-size="11" fill="#78350f" text-anchor="middle">KV / Hidden + 3D Rel-Time RoPE</text>

  <!-- System 1 Fast Executor -->
  <rect x="570" y="370" width="430" height="96" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="785" y="393" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">System 1 — Fast Action Head</text>
  <rect x="584" y="404" width="195" height="49" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="681.5" y="424" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Paged Cross-Attention</text>
  <text x="681.5" y="442" font-size="11" fill="#047857" text-anchor="middle">100% Local HBM Bandwidth</text>
  <rect x="791" y="404" width="195" height="49" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="888.5" y="424" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Bucketed CUDA Graphs</text>
  <text x="888.5" y="442" font-size="11" fill="#047857" text-anchor="middle">FP8 Backbone + BF16 Head</text>

  <!-- ==================== COLUMN 4: STREAMING RTC RING ==================== -->
  <rect x="1086" y="48" width="216" height="432" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="1194" y="74" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">4. Streaming RTC Ring</text>
  <line x1="1102" y1="86" x2="1286" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Horizon Aligner -->
  <rect x="1100" y="172" width="188" height="164" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="1194" y="197" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">Horizon Splice &amp; Ring</text>
  <rect x="1112" y="210" width="164" height="48" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="1194" y="231" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Deterministic t_splice</text>
  <text x="1194" y="248" font-size="10.8" fill="#115e59" text-anchor="middle">Phase-Continuous Switch</text>
  <rect x="1112" y="270" width="164" height="48" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="1194" y="291" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Overrun Envelope</text>
  <text x="1194" y="308" font-size="10.8" fill="#115e59" text-anchor="middle">Cubic Hermite Blending</text>

  <!-- Continuous Control Output -->
  <rect x="1100" y="382" width="188" height="84" rx="9" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="1194" y="414" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Zero-Underrun Actions</text>
  <text x="1194" y="436" font-size="11.2" fill="#cbd5e1" text-anchor="middle">100–1000 Hz Continuous</text>
  <text x="1194" y="453" font-size="11.2" fill="#94a3b8" text-anchor="middle">Multi-Robot Control</text>

  <!-- ==================== ARROWS & FLOWS ==================== -->
  <!-- Col 1 -> Col 2 -->
  <line x1="216" y1="158" x2="286" y2="158" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>
  <line x1="216" y1="398" x2="286" y2="398" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>

  <!-- Col 2 Internal -->
  <line x1="389" y1="206" x2="389" y2="234" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow-data)"/>
  <line x1="389" y1="346" x2="389" y2="310" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-ctrl)"/>
  <text x="434" y="332" font-size="11" font-weight="600" fill="#e11d48" text-anchor="middle">Preempt</text>

  <!-- Col 2 -> Col 3 -->
  <line x1="490" y1="142" x2="568" y2="142" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>
  <path d="M 490 272 L 536 272 L 536 172 L 568 172" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-ctrl)"/>
  <text x="524" y="224" font-size="10.8" font-weight="600" fill="#be123c" text-anchor="middle" transform="rotate(-90 524 224)">Slice Gate</text>
  <line x1="490" y1="418" x2="568" y2="418" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>

  <!-- Col 3: Slow -> TSC -->
  <line x1="681.5" y1="198" x2="681.5" y2="230" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-tsc)"/>
  <text x="626" y="218" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Zero-Copy Write</text>
  <line x1="888.5" y1="198" x2="888.5" y2="230" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-tsc)"/>
  <text x="946" y="218" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">P2P Pre-Push</text>

  <!-- Col 3: TSC -> Fast -->
  <line x1="681.5" y1="336" x2="681.5" y2="368" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-tsc)"/>
  <text x="626" y="356" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Wait-Free Pin</text>
  <line x1="888.5" y1="336" x2="888.5" y2="368" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-tsc)"/>
  <text x="946" y="356" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">Rel-Time Read</text>

  <!-- Col 4 -> Col 3: Frozen Prefix Feedback (inner lane x=1030) -->
  <path d="M 1194 172 L 1194 126 L 1030 126 L 1030 396 L 1002 396" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-dasharray="6,4" marker-end="url(#arrow-rtc)"/>
  <rect x="1100" y="114" width="102" height="24" rx="5" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="1151" y="130" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Frozen Prefix</text>

  <!-- Col 3 -> Col 4: Action Chunk Output (outer lane x=1068, label centered cleanly at x=1053) -->
  <path d="M 1000 442 L 1068 442 L 1068 254 L 1098 254" fill="none" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-data)"/>
  <text x="1054" y="348" font-size="10.8" font-weight="600" fill="#1e293b" text-anchor="middle" transform="rotate(-90 1054 348)">Action Chunk</text>

  <!-- Col 4: Horizon Aligner -> Continuous Output -->
  <line x1="1194" y1="336" x2="1194" y2="380" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-data)"/>

  <!-- ==================== LEGEND BAR ==================== -->
  <rect x="18" y="496" width="1284" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <line x1="46" y1="516" x2="86" y2="516" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-data)"/>
  <text x="96" y="520" font-size="12" fill="#334155">Observation &amp; Action Tensors</text>

  <line x1="332" y1="516" x2="372" y2="516" stroke="#b45309" stroke-width="2.1" marker-end="url(#arrow-tsc)"/>
  <text x="382" y="520" font-size="12" fill="#334155">Lock-Free Cache Write &amp; Read</text>

  <line x1="696" y1="516" x2="736" y2="516" stroke="#e11d48" stroke-width="1.9" stroke-dasharray="5,4" marker-end="url(#arrow-ctrl)"/>
  <text x="746" y="520" font-size="12" fill="#334155">Colocated ≤ 2 ms Slice Preemption</text>

  <line x1="1014" y1="516" x2="1054" y2="516" stroke="#0f766e" stroke-width="1.9" stroke-dasharray="6,4" marker-end="url(#arrow-rtc)"/>
  <text x="1064" y="520" font-size="12" fill="#334155">In-Flight Frozen Prefix Feedback</text>
</svg>
