<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 492" width="1320" height="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-cache" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-rtc" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="6.8" markerHeight="6.8" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1320" height="492" rx="10" fill="#ffffff"/>

  <!-- Header -->
  <text x="660" y="29" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Tempo Architecture</text>

  <!-- ==================== COLUMN 1: ROBOT STREAMS ==================== -->
  <rect x="18" y="48" width="212" height="426" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="124" y="74" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">1. Robot Streams (N)</text>
  <line x1="34" y1="86" x2="214" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="32" y="114" width="184" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="124" y="148" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">Slow Input (1–10 Hz)</text>
  <text x="124" y="172" font-size="11.5" fill="#475569" text-anchor="middle">Cameras &amp; Language</text>

  <rect x="32" y="344" width="184" height="92" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="124" y="378" font-size="13.5" font-weight="700" fill="#1e293b" text-anchor="middle">Fast Input (10–30 Hz)</text>
  <text x="124" y="402" font-size="11.5" fill="#475569" text-anchor="middle">State / Action Noise</text>

  <text x="124" y="278" font-size="11.5" fill="#64748b" text-anchor="middle">Latest-frame overwrite</text>

  <!-- ==================== COLUMN 2: C++ SCHEDULER ==================== -->
  <rect x="272" y="48" width="234" height="426" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="389" y="74" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">2. C++ Scheduler</text>
  <line x1="288" y1="86" x2="490" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="288" y="114" width="202" height="92" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="389" y="148" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Staleness Queue</text>
  <text x="389" y="172" font-size="11.5" fill="#1e40af" text-anchor="middle">Refreshes Oldest Streams First</text>

  <rect x="288" y="344" width="202" height="92" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="389" y="378" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">Deadline Batcher</text>
  <text x="389" y="402" font-size="11.5" fill="#047857" text-anchor="middle">Dynamic Batch Within Deadline</text>

  <!-- ==================== COLUMN 3: GPU EXECUTION & CACHE ==================== -->
  <rect x="554" y="48" width="462" height="426" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.7" filter="url(#card-shadow)"/>
  <text x="785" y="74" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">3. GPU Execution &amp; Shared Cache</text>
  <line x1="572" y1="86" x2="998" y2="86" stroke="#cbd5e1" stroke-width="1"/>

  <!-- System 2 Slow Backbone -->
  <rect x="570" y="102" width="430" height="96" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="785" y="125" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">System 2 — Slow VLM Backbone</text>
  <rect x="584" y="137" width="195" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="681.5" y="158" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">≤ 2 ms Graph Slices</text>
  <text x="681.5" y="175" font-size="11" fill="#2563eb" text-anchor="middle">Single-GPU Colocation</text>
  <rect x="791" y="137" width="195" height="48" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="888.5" y="158" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Disaggregated / Pipeline</text>
  <text x="888.5" y="175" font-size="11" fill="#2563eb" text-anchor="middle">Multi-GPU &amp; Edge-Cloud</text>

  <!-- Shared KV & Latent Cache -->
  <rect x="570" y="232" width="430" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="785" y="256" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="middle">Shared KV &amp; Latent Cache</text>
  <rect x="584" y="268" width="195" height="48" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="681.5" y="289" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Lock-Free RCU Slots</text>
  <text x="681.5" y="306" font-size="11" fill="#78350f" text-anchor="middle">Non-Blocking Read &amp; Write</text>
  <rect x="791" y="268" width="195" height="48" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="888.5" y="289" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Paged Memory Pool</text>
  <text x="888.5" y="306" font-size="11" fill="#78350f" text-anchor="middle">3D Relative-Time RoPE</text>

  <!-- System 1 Fast Head -->
  <rect x="570" y="362" width="430" height="96" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="785" y="385" font-size="13.5" font-weight="700" fill="#065f46" text-anchor="middle">System 1 — Fast Action Head</text>
  <rect x="584" y="397" width="195" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="681.5" y="418" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Paged Cross-Attention</text>
  <text x="681.5" y="435" font-size="11" fill="#047857" text-anchor="middle">Split-K Decoding</text>
  <rect x="791" y="397" width="195" height="48" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="888.5" y="418" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Bucketed CUDA Graphs</text>
  <text x="888.5" y="435" font-size="11" fill="#047857" text-anchor="middle">FP8 / BF16 Precision</text>

  <!-- ==================== COLUMN 4: RTC RING ==================== -->
  <rect x="1086" y="48" width="216" height="426" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="1194" y="74" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">4. RTC Action Ring</text>
  <line x1="1102" y1="86" x2="1286" y2="86" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="1100" y="172" width="188" height="160" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="1194" y="197" font-size="13" font-weight="700" fill="#115e59" text-anchor="middle">Real-Time Chunking</text>
  <rect x="1112" y="210" width="164" height="46" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="1194" y="230" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Frozen-Prefix Splice</text>
  <text x="1194" y="246" font-size="10.8" fill="#115e59" text-anchor="middle">Phase-Continuous Switch</text>
  <rect x="1112" y="268" width="164" height="46" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
  <text x="1194" y="288" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Overrun Blending</text>
  <text x="1194" y="304" font-size="10.8" fill="#115e59" text-anchor="middle">Smooth Trajectory Handoff</text>

  <rect x="1100" y="378" width="188" height="78" rx="9" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <text x="1194" y="410" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Continuous Control</text>
  <text x="1194" y="432" font-size="11.2" fill="#cbd5e1" text-anchor="middle">100–1000 Hz Action Polling</text>

  <!-- ==================== ARROWS ==================== -->
  <!-- Col 1 -> Col 2 -->
  <line x1="216" y1="160" x2="286" y2="160" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>
  <line x1="216" y1="390" x2="286" y2="390" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>

  <!-- Fast Preempts Colocated Slow Slices -->
  <path d="M 389 344 L 389 272 L 530 272 L 530 172 L 568 172" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-ctrl)"/>
  <text x="456" y="263" font-size="11" font-weight="600" fill="#be123c" text-anchor="middle">Slice Preemption</text>

  <!-- Col 2 -> Col 3 -->
  <line x1="490" y1="146" x2="568" y2="146" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>
  <line x1="490" y1="410" x2="568" y2="410" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow-data)"/>

  <!-- Col 3: Slow -> Cache -> Fast -->
  <line x1="681.5" y1="198" x2="681.5" y2="230" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-cache)"/>
  <line x1="888.5" y1="198" x2="888.5" y2="230" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-cache)"/>
  <line x1="681.5" y1="328" x2="681.5" y2="360" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-cache)"/>
  <line x1="888.5" y1="328" x2="888.5" y2="360" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-cache)"/>

  <!-- Col 4 -> Col 3: Frozen Prefix Feedback -->
  <path d="M 1194 172 L 1194 126 L 1030 126 L 1030 392 L 1002 392" fill="none" stroke="#0f766e" stroke-width="1.9" stroke-dasharray="6,4" marker-end="url(#arrow-rtc)"/>
  <rect x="1100" y="114" width="102" height="24" rx="5" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
  <text x="1151" y="130" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">Frozen Prefix</text>

  <!-- Col 3 -> Col 4: Action Chunk Output -->
  <path d="M 1000 432 L 1068 432 L 1068 252 L 1098 252" fill="none" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-data)"/>
  <text x="1054" y="342" font-size="10.8" font-weight="600" fill="#1e293b" text-anchor="middle" transform="rotate(-90 1054 342)">Action Chunk</text>

  <!-- Col 4: RTC -> Continuous Control -->
  <line x1="1194" y1="332" x2="1194" y2="376" stroke="#1e293b" stroke-width="2.1" marker-end="url(#arrow-data)"/>
</svg>
